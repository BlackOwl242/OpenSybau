name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run desktop:dist
      - name: Regenerate updater metadata from the final installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

          $installer = "release/OpenSybau-Setup-$version-x64.exe"
          $installerPath = Join-Path $PWD $installer
          $installerName = Split-Path $installer -Leaf
          $installerSize = (Get-Item -LiteralPath $installerPath).Length
          $hashHex = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA512).Hash
          $hashBytes = [byte[]]::new($hashHex.Length / 2)
          for ($i = 0; $i -lt $hashBytes.Length; $i++) {
            $hashBytes[$i] = [Convert]::ToByte($hashHex.Substring($i * 2, 2), 16)
          }
          $sha512 = [Convert]::ToBase64String($hashBytes)
          $releaseDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $metadata = @"
          version: $version
          files:
            - url: $installerName
              sha512: $sha512
              size: $installerSize
          path: $installerName
          sha512: $sha512
          releaseDate: '$releaseDate'
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD "release/latest.yml"), $metadata, [System.Text.UTF8Encoding]::new($false))
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            release/OpenSybau-Setup-*.exe
            release/OpenSybau-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rpm ruby ruby-dev
          sudo gem install --no-document fpm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run desktop:dist:linux
      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            release/linux/OpenSybau-*.deb
            release/linux/OpenSybau-*.rpm
            release/linux/latest-linux.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Install dependencies
        run: npm ci
      - name: Build Android APK
        run: npm run android:apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-android
          path: |
            release/android/OpenSybau-*.apk
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux, android]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Verify release version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish Windows and Linux installers
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((line) => line.startsWith(`## [${version}]`));
            if (start < 0) throw new Error(`Missing changelog entry for ${version}`);
            const next = lines.findIndex((line, index) => index > start && line.startsWith("## ["));
            fs.writeFileSync("release-notes.md", `${lines.slice(start, next < 0 ? undefined : next).join("\n")}\n`);
          '
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "OpenSybau $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
