name: Publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run desktop:dist
      - name: Regenerate updater metadata from the final installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

          $installer = "release/OpenSybau-Setup-$version-x64.exe"
          $installerPath = Join-Path $PWD $installer
          $installerName = Split-Path $installer -Leaf
          $installerSize = (Get-Item -LiteralPath $installerPath).Length
          $hashHex = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA512).Hash
          $hashBytes = [byte[]]::new($hashHex.Length / 2)
          for ($i = 0; $i -lt $hashBytes.Length; $i++) {
            $hashBytes[$i] = [Convert]::ToByte($hashHex.Substring($i * 2, 2), 16)
          }
          $sha512 = [Convert]::ToBase64String($hashBytes)
          $releaseDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $metadata = @"
          version: $version
          files:
            - url: $installerName
              sha512: $sha512
              size: $installerSize
          path: $installerName
          sha512: $sha512
          releaseDate: '$releaseDate'
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD "release/latest.yml"), $metadata, [System.Text.UTF8Encoding]::new($false))
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            release/OpenSybau-Setup-*.exe
            release/OpenSybau-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run desktop:dist:linux
      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            release/linux/OpenSybau-*.deb
            release/linux/OpenSybau-*.rpm
            release/linux/latest-linux.yml
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Verify release version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish Windows and Linux installers
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "OpenSybau $GITHUB_REF_NAME" \
            --notes "Windows x64, Debian/Ubuntu x64, and Fedora/RHEL x64 desktop installers." \
            --verify-tag \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
