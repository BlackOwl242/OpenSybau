plugins {
    id 'com.android.application'
}

android {
    namespace "com.opensybau.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.opensybau.mobile"
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName "0.3.12"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("OPENSYBAU_ANDROID_KEYSTORE") ?: ""
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("OPENSYBAU_ANDROID_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("OPENSYBAU_ANDROID_KEY_ALIAS") ?: ""
                keyPassword System.getenv("OPENSYBAU_ANDROID_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            if (System.getenv("OPENSYBAU_ANDROID_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
