<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121316" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OpenSybau · Local AI</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/opensybau.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/opensybau-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/opensybau.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        background: #121316;
        color: #e4e4e7;
        font-family: "Nunito Sans Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .boot-screen,
      .wb-boot-loader {
        height: 100%;
        min-height: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 28px;
        box-sizing: border-box;
        text-align: center;
        user-select: none;
      }
      .wb-boot-logo-stage {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        background: rgba(255, 255, 255, 0.025);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .wb-boot-svg {
        width: 44px;
        height: 44px;
        color: #f4f4f5;
        display: block;
        overflow: visible;
      }
      .wb-boot-svg .wireframe {
        stroke: currentColor;
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 160;
        animation: wb-wire-draw 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .wb-boot-svg .solid-fill-rect {
        animation: wb-clip-wave-fill 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .wb-boot-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .wb-boot-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #f4f4f5;
      }
      .wb-boot-subtitle {
        font-size: 12.5px;
        color: #a1a1aa;
        max-width: 320px;
        line-height: 1.45;
      }
      @keyframes wb-wire-draw {
        0% { stroke-dashoffset: 160; opacity: 0.35; }
        38%, 85% { stroke-dashoffset: 0; opacity: 0.9; }
        100% { stroke-dashoffset: -160; opacity: 0.35; }
      }
      @keyframes wb-clip-wave-fill {
        0%, 20% { transform: translate(-64px, 64px); }
        55%, 82% { transform: translate(0px, 0px); }
        100% { transform: translate(64px, -64px); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="wb-boot-logo-stage" aria-hidden="true">
          <svg class="wb-boot-svg" viewBox="0 0 64 64" fill="none">
            <defs>
              <clipPath id="wbBootLogoClip">
                <circle cx="19.6" cy="19.8" r="6.8" />
                <circle cx="44.4" cy="44.2" r="6.8" />
                <path d="M29.8 24.2C29.8 23.45 30.22 22.76 30.89 22.43L48.72 13.51C49.91 12.92 51.2 13.78 51.2 15.11V24.9C51.2 25.65 50.78 26.34 50.11 26.67L35.09 34.18C34.55 34.45 34.2 35 34.2 35.61V39.8C34.2 40.55 33.78 41.24 33.11 41.57L15.28 50.49C14.09 51.08 12.8 50.22 12.8 48.89V39.1C12.8 38.35 13.22 37.66 13.89 37.33L28.91 29.82C29.45 29.55 29.8 29 29.8 28.39V24.2Z" />
              </clipPath>
            </defs>
            <g class="wireframe">
              <circle cx="19.6" cy="19.8" r="6.1" />
              <circle cx="44.4" cy="44.2" r="6.1" />
              <path d="M29.8 24.2C29.8 23.45 30.22 22.76 30.89 22.43L48.72 13.51C49.91 12.92 51.2 13.78 51.2 15.11V24.9C51.2 25.65 50.78 26.34 50.11 26.67L35.09 34.18C34.55 34.45 34.2 35 34.2 35.61V39.8C34.2 40.55 33.78 41.24 33.11 41.57L15.28 50.49C14.09 51.08 12.8 50.22 12.8 48.89V39.1C12.8 38.35 13.22 37.66 13.89 37.33L28.91 29.82C29.45 29.55 29.8 29 29.8 28.39V24.2Z" />
            </g>
            <g clip-path="url(#wbBootLogoClip)">
              <rect class="solid-fill-rect" x="-10" y="-10" width="84" height="84" fill="currentColor" />
            </g>
          </svg>
        </div>
        <div class="wb-boot-copy">
          <strong class="wb-boot-title">OpenSybau</strong>
          <span class="wb-boot-subtitle">Đang khởi động không gian làm việc…</span>
        </div>
      </div>
    </div>
    <div id="overlay"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
