<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OpenSybau · Local AI</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/opensybau.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/opensybau-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/opensybau.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script>
      (function () {
        var BOOT_THEMES = {
          "obsidian": { bg: "#18191b", chrome: "#101114", panel: "#262729", fg: "#fafafa", muted: "#9898a2", border: "rgba(255,255,255,0.08)", light: false },
          "carbon-oled": { bg: "#050608", chrome: "#050608", panel: "#0c0e14", fg: "#ffffff", muted: "#9ca3af", border: "rgba(255,255,255,0.09)", light: false },
          "antigravity": { bg: "#090d1a", chrome: "#0a0d18", panel: "#10172c", fg: "#f8fafc", muted: "#94a3b8", border: "rgba(129,140,248,0.16)", light: false },
          "tokyo-night": { bg: "#1a1b26", chrome: "#16161e", panel: "#1f2335", fg: "#e2e8f0", muted: "#7aa2f7", border: "rgba(169,177,214,0.14)", light: false },
          "synthwave": { bg: "#11081d", chrome: "#12091e", panel: "#1b0e2e", fg: "#fdf4ff", muted: "#c084fc", border: "rgba(216,180,254,0.15)", light: false },
          "catppuccin": { bg: "#1e1e2e", chrome: "#181825", panel: "#252538", fg: "#f5e0dc", muted: "#a6adc8", border: "rgba(205,214,244,0.13)", light: false },
          "emerald": { bg: "#06120e", chrome: "#071310", panel: "#0b1e18", fg: "#ecfdf5", muted: "#6ee7b7", border: "rgba(110,231,183,0.15)", light: false },
          "rose-pine": { bg: "#1f1d2e", chrome: "#191724", panel: "#26233a", fg: "#fffaf3", muted: "#908caa", border: "rgba(224,222,244,0.13)", light: false },
          "amber-forge": { bg: "#130f08", chrome: "#141009", panel: "#1e170d", fg: "#fffbeb", muted: "#d6b88a", border: "rgba(253,230,138,0.14)", light: false },
          "nordic": { bg: "#242936", chrome: "#1b202b", panel: "#2b3140", fg: "#eceff4", muted: "#9aa5b8", border: "rgba(216,222,233,0.14)", light: false },
          "daylight": { bg: "#ffffff", chrome: "#f8fafc", panel: "#f8fafc", fg: "#0f172a", muted: "#475569", border: "rgba(15,23,42,0.11)", light: true },
          "warm-stone": { bg: "#faf7f2", chrome: "#f5f0eb", panel: "#f4efe6", fg: "#141413", muted: "#57534e", border: "rgba(28,25,23,0.12)", light: true },
          "sakura-light": { bg: "#fffbfc", chrome: "#fdf7f9", panel: "#fcf2f6", fg: "#27101a", muted: "#754658", border: "rgba(136,19,55,0.12)", light: true },
          "paper-ink": { bg: "#faf8f5", chrome: "#f5f2ed", panel: "#f3efe8", fg: "#18181b", muted: "#52525b", border: "rgba(24,24,27,0.12)", light: true },
          "alabaster": { bg: "#fafafa", chrome: "#f4f4f5", panel: "#f4f4f5", fg: "#09090b", muted: "#52525b", border: "rgba(9,9,11,0.1)", light: true },
          "warm-linen": { bg: "#faf7f2", chrome: "#f5f0eb", panel: "#f4efe6", fg: "#1c1917", muted: "#57534e", border: "rgba(28,25,23,0.12)", light: true }
        };
        var themeId = "obsidian";
        try {
          var saved = localStorage.getItem("opensybau.theme.v2") || localStorage.getItem("opensybau.theme");
          if (
            saved === "carbon-oled" &&
            localStorage.getItem("opensybau.mobile-oled-default.v1") === "1" &&
            !localStorage.getItem("opensybau.mobile-obsidian-default.v2")
          ) {
            localStorage.setItem("opensybau.mobile-obsidian-default.v2", "1");
            localStorage.setItem("opensybau.theme", "obsidian");
            saved = "obsidian";
          }
          if (saved && BOOT_THEMES[saved]) {
            themeId = saved;
          }
        } catch (_err) {}
        var entry = BOOT_THEMES[themeId] || BOOT_THEMES["obsidian"];
        var scheme = entry.light ? "light" : "dark";
        var root = document.documentElement;
        root.dataset.theme = themeId;
        root.dataset.wbTheme = themeId;
        root.dataset.colorScheme = scheme;
        root.dataset.wbScheme = scheme;
        root.style.colorScheme = scheme;
        root.style.setProperty("--wb-boot-bg", entry.bg);
        root.style.setProperty("--wb-boot-fg", entry.fg);
        root.style.setProperty("--wb-boot-panel", entry.panel);
        root.style.setProperty("--wb-boot-muted", entry.muted);
        root.style.setProperty("--wb-boot-border", entry.border);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute("content", entry.chrome);
        var metaScheme = document.querySelector('meta[name="color-scheme"]');
        if (metaScheme) metaScheme.setAttribute("content", scheme);
        try {
          if (window.opensybauAndroid && typeof window.opensybauAndroid.setSystemBarTheme === "function") {
            window.opensybauAndroid.setSystemBarTheme(entry.chrome, Boolean(entry.light));
          }
        } catch (_bridgeErr) {}
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        max-width: 100vw;
        overflow-x: clip;
        background: var(--wb-boot-bg, #0b0e14);
        color: var(--wb-boot-fg, #e6edf3);
        font-family: "Nunito Sans Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .boot-screen,
      .wb-boot-loader,
      .wb-boot-splash,
      #wb-boot-splash {
        background: var(--wb-boot-bg, #0b0e14);
        color: var(--wb-boot-fg, #e6edf3);
      }
      .boot-screen,
      .wb-boot-loader {
        height: 100%;
        min-height: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 28px;
        box-sizing: border-box;
        text-align: center;
        user-select: none;
      }
      .wb-boot-logo-stage {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 1px solid var(--wb-border-subtle, var(--wb-boot-border, rgba(255, 255, 255, 0.09)));
        background: var(--wb-panel, var(--wb-boot-panel, #18191b));
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .wb-boot-svg {
        width: 44px;
        height: 44px;
        color: var(--wb-ink-strong, var(--wb-boot-fg, #e6edf3));
        display: block;
        overflow: visible;
      }
      .wb-boot-svg .wireframe {
        stroke: currentColor;
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 160;
        animation: wb-wire-draw 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .wb-boot-svg .solid-fill-rect {
        animation: wb-clip-wave-fill 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .wb-boot-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .wb-boot-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--wb-ink-strong, var(--wb-boot-fg, #e6edf3));
      }
      .wb-boot-subtitle {
        font-size: 12.5px;
        color: var(--wb-muted, var(--wb-boot-muted, #9898a2));
        max-width: 320px;
        line-height: 1.45;
      }
      @keyframes wb-wire-draw {
        0% { stroke-dashoffset: 160; opacity: 0.35; }
        38%, 85% { stroke-dashoffset: 0; opacity: 0.9; }
        100% { stroke-dashoffset: -160; opacity: 0.35; }
      }
      @keyframes wb-clip-wave-fill {
        0%, 20% { transform: translate(-64px, 64px); }
        55%, 82% { transform: translate(0px, 0px); }
        100% { transform: translate(64px, -64px); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="wb-boot-logo-stage" aria-hidden="true">
          <svg class="wb-boot-svg" viewBox="0 0 64 64" fill="none">
            <defs>
              <clipPath id="wbBootLogoClip">
                <circle cx="19.6" cy="19.8" r="6.8" />
                <circle cx="44.4" cy="44.2" r="6.8" />
                <path d="M29.8 24.2C29.8 23.45 30.22 22.76 30.89 22.43L48.72 13.51C49.91 12.92 51.2 13.78 51.2 15.11V24.9C51.2 25.65 50.78 26.34 50.11 26.67L35.09 34.18C34.55 34.45 34.2 35 34.2 35.61V39.8C34.2 40.55 33.78 41.24 33.11 41.57L15.28 50.49C14.09 51.08 12.8 50.22 12.8 48.89V39.1C12.8 38.35 13.22 37.66 13.89 37.33L28.91 29.82C29.45 29.55 29.8 29 29.8 28.39V24.2Z" />
              </clipPath>
            </defs>
            <g class="wireframe">
              <circle cx="19.6" cy="19.8" r="6.1" />
              <circle cx="44.4" cy="44.2" r="6.1" />
              <path d="M29.8 24.2C29.8 23.45 30.22 22.76 30.89 22.43L48.72 13.51C49.91 12.92 51.2 13.78 51.2 15.11V24.9C51.2 25.65 50.78 26.34 50.11 26.67L35.09 34.18C34.55 34.45 34.2 35 34.2 35.61V39.8C34.2 40.55 33.78 41.24 33.11 41.57L15.28 50.49C14.09 51.08 12.8 50.22 12.8 48.89V39.1C12.8 38.35 13.22 37.66 13.89 37.33L28.91 29.82C29.45 29.55 29.8 29 29.8 28.39V24.2Z" />
            </g>
            <g clip-path="url(#wbBootLogoClip)">
              <rect class="solid-fill-rect" x="-10" y="-10" width="84" height="84" fill="currentColor" />
            </g>
          </svg>
        </div>
        <div class="wb-boot-copy">
          <strong class="wb-boot-title">OpenSybau</strong>
          <span class="wb-boot-subtitle">Đang khởi động không gian làm việc…</span>
        </div>
      </div>
    </div>
    <div id="overlay"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
